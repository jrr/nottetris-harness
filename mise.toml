# LÖVE's own macOS builds, for ./play.sh --mac. `mise install` fetches them
# all. LÖVE before 11.4 is Intel-only and runs under Rosetta; 0.7.2's build is
# 32-bit and can't run on current macOS at all (use ./play.sh without --mac).
# Asset names changed over the years, so each version names its own.
# The first one listed (the latest stable release) is the `love` on PATH
# inside this directory; the rest follow oldest first.
[tools]
"github:love2d/love" = [
	{ version = "11.5", asset_pattern = "love-11.5-macos.zip", bin_path = "love.app/Contents/MacOS" },
	{ version = "11.4", asset_pattern = "love-11.4-macos.zip", bin_path = "love.app/Contents/MacOS" },
	{ version = "11.3", asset_pattern = "love-11.3-macos.zip", bin_path = "love.app/Contents/MacOS" },
	{ version = "0.10.2", asset_pattern = "love-0.10.2-macosx-x64.zip", bin_path = "love.app/Contents/MacOS" },
	{ version = "0.9.2", asset_pattern = "love-0.9.2-macosx-x64.zip", bin_path = "love.app/Contents/MacOS" },
	{ version = "0.8.0", asset_pattern = "love-0.8.0-macosx-ub.zip", bin_path = "love.app/Contents/MacOS" },
]

# `mise run love-file`: zips game/ into out/nottetris.love, which any LÖVE of
# the version the game asks for (or a web player like love.js) can run.
# main.lua has to be at the zip's root, hence zipping from inside game/.
[tasks.love-file]
dir = "{{config_root}}/game"
run = """
mkdir -p ../out
rm -f ../out/nottetris.love
zip -9 -qr ../out/nottetris.love . -x '.git*' '*.DS_Store'
echo out/nottetris.love
"""

# `mise run web`: plays the game in a browser at http://localhost:8000 (see
# lib/build-web.sh).
[tasks.web]
dir = "{{config_root}}"
run = """
lib/build-web.sh
echo "http://localhost:8000"
python3 -m http.server -b 127.0.0.1 -d out/web 8000
"""
